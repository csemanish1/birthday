<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Countdown → Oct 12, 2026 12:00 AM</title>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&family=Orbitron:wght@500;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg1:#0f0c29; --bg2:#302b63; --bg3:#24243e;
    --accent:#7c5cff; --accent2:#00e5ff; --gold:#f6c667;
    --card:rgba(255,255,255,.06); --stroke:rgba(255,255,255,.14);
  }
  *{margin:0;padding:0;box-sizing:border-box;}
  body{
    font-family:'Poppins',sans-serif;color:#eef;
    min-height:100vh;display:flex;flex-direction:column;
    align-items:center;justify-content:center;gap:26px;
    background:linear-gradient(160deg,var(--bg1),var(--bg2) 50%,var(--bg3));
    overflow-x:hidden;padding:40px 16px;
  }
  h1{
    font-size:clamp(1.3rem,3.5vw,2rem);font-weight:600;text-align:center;
    background:linear-gradient(90deg,var(--accent2),var(--accent),var(--gold));
    -webkit-background-clip:text;background-clip:text;color:transparent;
  }
  .sub{opacity:.65;font-weight:300;font-size:.95rem;text-align:center;}

  /* ---------- TIMER CARDS ---------- */
  .timer{display:flex;gap:16px;flex-wrap:wrap;justify-content:center;}
  .card{
    width:120px;padding:22px 8px;border-radius:20px;text-align:center;
    background:var(--card);border:1px solid var(--stroke);
    backdrop-filter:blur(10px);
    box-shadow:0 12px 40px rgba(0,0,0,.35), inset 0 1px 0 rgba(255,255,255,.08);
    transition:transform .3s;
  }
  .card:hover{transform:translateY(-6px);}
  .num{
    font-family:'Orbitron',monospace;font-size:2.4rem;font-weight:700;
    background:linear-gradient(180deg,#fff,#b9a7ff);
    -webkit-background-clip:text;background-clip:text;color:transparent;
    display:block;line-height:1.1;
  }
  .lbl{font-size:.68rem;letter-spacing:3px;text-transform:uppercase;opacity:.55;margin-top:6px;}
  .num.tick{animation:tick .5s ease;}
  @keyframes tick{
    0%{transform:scale(1)}
    35%{transform:scale(1.18);text-shadow:0 0 18px rgba(124,92,255,.8)}
    100%{transform:scale(1)}
  }

  /* ---------- PROGRESS ---------- */
  .progress-wrap{width:min(620px,90vw);}
  .progress{
    height:10px;border-radius:99px;background:rgba(255,255,255,.08);
    overflow:hidden;border:1px solid var(--stroke);
  }
  .bar{
    height:100%;width:0%;border-radius:99px;
    background:linear-gradient(90deg,var(--accent2),var(--accent),var(--gold));
    transition:width 1s linear;
  }
  .progress-meta{display:flex;justify-content:space-between;font-size:.78rem;opacity:.6;margin-top:8px;}

  /* ---------- CONTROLS ---------- */
  .controls{display:flex;gap:10px;flex-wrap:wrap;justify-content:center;}
  button{
    font-family:'Poppins';font-size:.85rem;padding:10px 20px;border-radius:99px;
    border:1px solid var(--stroke);cursor:pointer;color:#eef;
    background:var(--card);backdrop-filter:blur(8px);
    transition:transform .2s, background .2s, box-shadow .2s;
  }
  button:hover{transform:scale(1.06);background:rgba(255,255,255,.12);box-shadow:0 6px 20px rgba(124,92,255,.35);}
  button.primary{background:linear-gradient(145deg,var(--accent),#5a3ee0);border-color:transparent;}
  button.warn{border-color:rgba(255,110,150,.5);}

  .status{font-size:.85rem;opacity:.75;min-height:1.2em;}
  .done{
    color:var(--gold);font-weight:600;animation:glow 1s ease-in-out infinite alternate;
  }
  @keyframes glow{from{text-shadow:0 0 6px rgba(246,198,103,.3)}to{text-shadow:0 0 22px rgba(246,198,103,.9)}}

  /* zero-state flash */
  body.done-flash::after{
    content:"";position:fixed;inset:0;pointer-events:none;
    background:radial-gradient(circle at 50% 40%,rgba(246,198,103,.25),transparent 60%);
    animation:fade 1.4s ease forwards;
  }
  @keyframes fade{from{opacity:1}to{opacity:0}}

  @media (max-width:560px){
    .card{width:78px;padding:16px 4px;}
    .num{font-size:1.7rem;}
  }
</style>
</head>
<body>

<h1>⏳ Tick-tock! 🕒 Counting down</h1>
<p class="sub">The birthday countdown is officially on fire 🔥🎉</p>

<div class="timer" id="timer">
  <div class="card"><span class="num" id="days">--</span><span class="lbl">Days</span></div>
  <div class="card"><span class="num" id="hours">--</span><span class="lbl">Hours</span></div>
  <div class="card"><span class="num" id="minutes">--</span><span class="lbl">Minutes</span></div>
  <div class="card"><span class="num" id="seconds">--</span><span class="lbl">Seconds</span></div>
</div>

<div class="progress-wrap">
  <div class="progress"><div class="bar" id="bar"></div></div>
  <div class="progress-meta"><span id="started-label">—</span><span id="pct">0%</span></div>
</div>

<div class="controls">
  <button id="pause-btn">⏸ Pause</button>
  <button id="reset-btn">↺ Reset</button>
  <button id="url-btn" class="primary">🔗 Redirect URL</button>
</div>

<p class="status" id="status">Running…</p>

<script>
/* ============ CONFIG ============ */
const TARGET_DATE = new Date(2026, 9, 12, 0, 0, 0); // 12 Oct 2026, 12:00 AM local
let REDIRECT_URL = "#"; // ← change this to your URL
const REDIRECT_DELAY_SECONDS = 10; // countdown shown after timer ends, then redirect

/* ============ STATE ============ */
const STORAGE_KEY = "cd-start-oct12-2026";
let startAt = Number(localStorage.getItem(STORAGE_KEY)) || Date.now();
localStorage.setItem(STORAGE_KEY, startAt);
const totalSpan = TARGET_DATE - startAt;

let paused = false, pausedRemaining = null, finished = false, intervalId = null;

const els = {
  days: document.getElementById("days"), hours: document.getElementById("hours"),
  minutes: document.getElementById("minutes"), seconds: document.getElementById("seconds"),
  bar: document.getElementById("bar"), pct: document.getElementById("pct"),
  status: document.getElementById("status"), started: document.getElementById("started-label"),
  body: document.body,
};
const lastVals = {};
const pad = n => String(n).padStart(2, "0");

/* ============ RENDER ============ */
function setNum(id, val){
  if (lastVals[id] === val) return;
  const el = els[id];
  el.textContent = val;
  el.classList.remove("tick"); void el.offsetWidth; el.classList.add("tick");
  lastVals[id] = val;
}

function updateCountdown(){
  if (finished) return;
  let remaining = paused ? pausedRemaining : TARGET_DATE - Date.now();

  if (remaining <= 0){
    finish();
    return;
  }

  const d = Math.floor(remaining / 864e5);
  const h = Math.floor(remaining / 36e5) % 24;
  const m = Math.floor(remaining / 6e4) % 60;
  const s = Math.floor(remaining / 1e3) % 60;

  setNum("days", String(d).padStart(2, "0"));
  setNum("hours", pad(h));
  setNum("minutes", pad(m));
  setNum("seconds", pad(s));

  const elapsed = paused ? (Date.now() - remaining - startAt) : (Date.now() - startAt);
  const pct = Math.min(100, Math.max(0, (elapsed / totalSpan) * 100));
  els.bar.style.width = pct.toFixed(2) + "%";
  els.pct.textContent = pct.toFixed(1) + "%";
}

/* ============ FINISH + REDIRECT ============ */
function finish(){
  finished = true;
  clearInterval(intervalId);
  ["days","hours","minutes","seconds"].forEach(k => { els[k].textContent = "00"; });
  els.bar.style.width = "100%";
  els.pct.textContent = "100%";
  els.body.classList.add("done-flash");
  els.status.classList.add("done");
  els.status.textContent = "🎉 Time's up! Redirecting to " + REDIRECT_URL + " in " + REDIRECT_DELAY_SECONDS + "s…";

  let left = REDIRECT_DELAY_SECONDS;
  const redirectTimer = setInterval(() => {
    left -= 1;
    els.status.textContent = "🎉 Time's up! Redirecting in " + left + "s… (click Cancel to stay)";
    if (left <= 0){
      clearInterval(redirectTimer);
      window.location.href = REDIRECT_URL;
    }
  }, 1000);

  // Allow the user to cancel the auto-redirect
  const cancelBtn = document.createElement("button");
  cancelBtn.className = "warn";
  cancelBtn.textContent = "✖ Cancel redirect";
  cancelBtn.onclick = () => {
    clearInterval(redirectTimer);
    cancelBtn.remove();
    els.status.textContent = "Redirect cancelled. Timer complete ✅";
    els.status.classList.remove("done");
  };
  document.querySelector(".controls").appendChild(cancelBtn);
}

/* ============ CONTROLS ============ */
document.getElementById("pause-btn").addEventListener("click", function(){
  if (finished) return;
  if (!paused){
    pausedRemaining = TARGET_DATE - Date.now();
    paused = true;
    this.textContent = "▶ Resume";
    els.status.textContent = "Paused ⏸";
  } else {
    startAt = Date.now() - (totalSpan - pausedRemaining); // keep progress bar consistent
    localStorage.setItem(STORAGE_KEY, startAt);
    paused = false;
    this.textContent = "⏸ Pause";
    els.status.textContent = "Running…";
  }
});

document.getElementById("reset-btn").addEventListener("click", function(){
  if (finished){ location.reload(); return; }
  startAt = Date.now();
  localStorage.setItem(STORAGE_KEY, startAt);
  paused = false;
  pausedRemaining = null;
  document.getElementById("pause-btn").textContent = "⏸ Pause";
  els.status.textContent = "Reset — counting to target ↺";
  updateCountdown();
});

document.getElementById("url-btn").addEventListener("click", () => {
  const url = prompt("URL to open when the timer ends:", REDIRECT_URL);
  if (url && url.trim()) { REDIRECT_URL = url.trim(); els.status.textContent = "Redirect URL saved ✓"; }
});

/* ============ INIT ============ */
els.started.textContent = "Started: " + new Date(startAt).toLocaleString();
updateCountdown();
intervalId = setInterval(updateCountdown, 1000);
</script>
</body>
</html>
